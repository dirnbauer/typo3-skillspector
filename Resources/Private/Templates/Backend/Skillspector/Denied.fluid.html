<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="module.title" domain="skillspector.messages" /></h1>
    <f:be.infobox
        title="{f:translate(key: 'denied.title', domain: 'skillspector.messages')}"
        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::ERROR')}"
    >
        <p><f:translate key="denied.message" domain="skillspector.messages" /></p>
    </f:be.infobox>
</f:section>
</html>
