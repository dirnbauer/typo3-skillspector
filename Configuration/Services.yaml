services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Commands register through #[AsCommand], the module controller through
  # #[AsController].
  Webconsulting\Skillspector\:
    resource: '../Classes/*'
    exclude:
      # Value objects, not services.
      - '../Classes/Domain'
      - '../Classes/Support'

  # Built from the extension configuration, once per container.
  Webconsulting\Skillspector\Domain\ExtensionSettings:
    factory: ['Webconsulting\Skillspector\Domain\ExtensionSettings', 'load']
    arguments:
      - '@TYPO3\CMS\Core\Configuration\ExtensionConfiguration'
