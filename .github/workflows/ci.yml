name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-progress --no-interaction
      - name: Audit dependencies
        run: composer audit --abandoned=fail
      - name: PHP syntax
        run: find Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n1 php -l

  cgl:
    name: Coding standards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer ci:cgl -- --dry-run

  phpstan:
    name: PHPStan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          ini-values: memory_limit=1G
      - run: composer install --no-progress --no-interaction
      - run: composer ci:phpstan

  unit:
    name: Unit tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer ci:tests:unit

  functional:
    name: Functional tests (PHP ${{ matrix.php-version }}, nr_llm ${{ matrix.nr-llm }}, MariaDB)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.4'
            nr-llm: '0.41'
          - php-version: '8.5'
            nr-llm: '0.41'
          - php-version: '8.4'
            nr-llm: '0.35'
          - php-version: '8.5'
            nr-llm: '0.35'
          - php-version: '8.4'
            nr-llm: '0.34'
    services:
      mariadb:
        image: mariadb:10.11.19@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: typo3_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseName: typo3_ci
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer update --with netresearch/nr-llm:~${{ matrix.nr-llm }}.0 --with-all-dependencies --no-progress --no-interaction
      - run: composer ci:tests:functional
